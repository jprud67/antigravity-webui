<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Antigravity" />
    <meta name="description" content="Cockpit WebUI haute performance pour Antigravity & Hermes" />
    <link rel="manifest" href="/manifest.json" />
    <title>Antigravity WebUI</title>
    <!-- Zero-Flash Pre-render: evaluate theme, skin and font size before paint -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('antigravity_theme') || localStorage.getItem('hermes-theme') || 'system';
          var s = localStorage.getItem('antigravity_skin') || localStorage.getItem('hermes-skin') || 'default';
          var f = localStorage.getItem('antigravity_font_size') || localStorage.getItem('hermes-font-size') || 'default';
          var isDark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.setAttribute('data-skin', s);
          document.documentElement.setAttribute('data-font-size', f);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
